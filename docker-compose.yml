services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cvat_progress
      POSTGRES_USER: cvat_user
      POSTGRES_PASSWORD: cvat_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvat_user -d cvat_progress"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://cvat_user:cvat_password@db:5432/cvat_progress
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
